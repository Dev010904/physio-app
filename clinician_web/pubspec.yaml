name: clinician_web
description: "PhysioSathi clinician dashboard: patients, codes, programs and progress."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # The patient app, for its theme, logo, Prescription and SessionPlan only.
  # Never import its dart:io or sqflite files (lib/link/, lib/data/) here.
  physio_app:
    path: ..
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
